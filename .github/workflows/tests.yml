name: Hodko SAT offline regression
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, ha-2026.11.2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.8'
      - run: python -m pip install uv==0.9.4
      - run: |
          python -m venv .venv
          if [ '${{ matrix.profile }}' = baseline ]; then
            uv pip sync hodko/requirements.lock --python .venv/bin/python --require-hashes
          else
            uv pip sync hodko/requirements-ha-2026.11.lock --python .venv/bin/python --require-hashes
            uv pip install --python .venv/bin/python --require-hashes --no-deps -r hodko/requirements-ha112.txt
          fi
      - run: uv pip install --python .venv/bin/python --require-hashes --no-deps -r hodko/requirements-sat5.lock
      - run: .venv/bin/python scripts/check_release.py
      - name: Verify release tag and repository identity
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .venv/bin/python scripts/check_release.py --for-publication --tag "$RELEASE_TAG"
      - run: .venv/bin/python scripts/run_tests.py --profile ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sat-${{ matrix.profile }}
          path: hodko-results-${{ matrix.profile }}-all.xml

  upstream-watch-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/test_watch_upstream.py
